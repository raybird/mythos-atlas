name: Mythos Atlas CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 1,7,13,19 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run content checks
        run: python scripts/ci_checks.py

  stats:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install chart dependencies
        run: python -m pip install matplotlib numpy

      - name: Generate statistics
        run: python scripts/generate_stats.py

      - name: Upload generated statistics
        uses: actions/upload-artifact@v4
        with:
          name: mythos-atlas-stats-${{ github.run_id }}
          path: |
            README.md
            stats/
